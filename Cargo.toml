[workspace]
resolver = "2"
members = [
    "crates/resume-core",
    "crates/resume-render-markdown",
    "apps/resume-app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/your-org/resume-design"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"
ts-rs = "10"
tauri = { version = "2" }
tauri-build = { version = "2" }
